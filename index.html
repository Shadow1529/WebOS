<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebOS - Apple Inspired Environment</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Top Menu Bar (macOS Style) -->
    <div id="top-bar" class="top-bar">
        <div class="top-bar-left">
            <button id="apple-menu-btn" class="apple-menu-btn" title="System Menu">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.83 6.35c.67-.83 1.12-1.98.99-3.13-.94.04-2.08.63-2.75 1.46-.58.7-1.1 1.84-.96 2.95 1.05.08 2.11-.53 2.72-1.28z"/></svg>
            </button>
            <span id="active-app-title" class="top-bar-app-name">Finder</span>
        </div>
        <div class="top-bar-right">
            <div class="top-bar-item">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
            </div>
            <div class="top-bar-item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="6" width="18" height="12" rx="2" ry="2"></rect><line x1="23" y1="11" x2="23" y2="13"></line></svg>
            </div>
            <div class="top-bar-item" id="top-clock">00:00</div>
        </div>
    </div>

    <!-- Desktop Viewport -->
    <div id="desktop" class="desktop">
        <div id="desktop-grid" class="desktop-grid"></div>
        <div id="window-layer" class="window-layer"></div>
    </div>

    <!-- Launchpad Menu -->
    <div id="launchpad" class="launchpad hidden">
        <div class="launchpad-search">
            <input type="text" id="launchpad-search-input" placeholder="Search applications...">
        </div>
        <div class="launchpad-grid" id="launchpad-grid"></div>
    </div>

    <!-- macOS / iPadOS Dock -->
    <div id="dock" class="dock">
        <button id="launchpad-btn" class="dock-btn launchpad-btn" title="Launchpad">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="12" cy="19" r="2"/><circle cx="19" cy="19" r="2"/></svg>
        </button>
        <div class="dock-separator"></div>
        <div id="dock-apps" class="dock-apps"></div>
    </div>

    <script type="module" src="js/kernel.js"></script>
</body>
</html>
